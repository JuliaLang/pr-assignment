name: CI
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  merge_group: # GitHub Merge Queue
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: '1'
      - name: Run the linter on the users.txt file
        run: |
          filename = "users.txt"
          fail = false
          for (i,line) in enumerate(eachline(filename, keep=true))
              if !occursin(r"^(@[a-zA-Z0-9]+)?(\s*#.*)?\n$", line)
                  println("::error file=$filename,line=$i::Line $i does not match linter regex: $line")
                  global fail = true
              end
          end
          if fail
              error("One or more lines failed the linter regex")
          end
        shell: julia --color=yes {0}
