name: CI
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  merge_group: # GitHub Merge Queue
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9 # v2.7.0
        with:
          version: '1'
      - name: Run the linter on the users.txt file
        run: |
          filename = "users.txt"
          fail = false
          for (i,line) in enumerate(eachline(filename, keep=true))
              if !occursin(r"^(@[a-zA-Z0-9]+)?(\s*#.*)?\n$", line)
                  println("::error file=$filename,line=$i::Line $i does not match linter regex: $line")
                  global fail = true
              end
          end
          if fail
              error("One or more lines failed the linter regex")
          end
        shell: julia --color=yes {0}
